model:
  name: resnet18
  num_classes: 1000
  pretrained: false

training:
  epochs: 100
  num_epochs: 100
  batch_size: 32
  lr: 0.001
  momentum: 0.9
  weight_decay: 0.0001
  optimizer: adam
  enable_profile: false
  profile_steps: 10
  pure_dataloader: false

scheduler:
  name: cosine
  min_lr: 0.00001

data:
  data_dir: ./data
  num_workers: 4
  pin_memory: true

logging:
  log_dir: ./logs
  save_checkpoint: true
  checkpoint_dir: ./checkpoints
  tensorboard: true
  wandb: false
